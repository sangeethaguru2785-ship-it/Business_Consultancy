<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060313">
    <meta name="robots" content="noindex">
    <title>Settings | Stackly</title>
    <link rel="icon" type="image/webp" href="images/logo-brand.webp">
    <link rel="apple-touch-icon" href="images/logo-brand.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body" data-dash-role="client" data-dash-page="settings">
    <div class="dashboard-shell" id="dashboardShell">
        <div id="dashSidebarHost"></div>
        <div class="dash-main">
            <div id="dashTopbarHost"></div>
            <main class="dash-content">
<div class="dash-page-head">
    <div>
        <span class="section-badge">CLIENT PORTAL · SETTINGS</span>
        <h1>Settings</h1>
        <p>Manage your profile and communication preferences.</p>
    </div>
    
</div><div class="dash-grid equal">
    <div class="dash-card">
        <div class="dash-card-head">
            <div>
                <h2>Profile</h2>
                <p>Your personal account details</p>
            </div>
        </div>
        <form onsubmit="return false">
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" class="form-control" value="Meera Nair" data-user-name-input>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" value="meera@novagroup.com" data-user-email-input>
            </div>
            <div class="mb-3">
                <label class="form-label">Company</label>
                <input type="text" class="form-control" value="Nova Group">
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" value="+1 (212) 555-0188">
            </div>
            <button class="dash-btn brand" type="button"><i class="bi bi-check2"></i> Save Changes</button>
        </form>
    </div>
    <div class="dash-card">
        <div class="dash-card-head">
            <div>
                <h2>Preferences</h2>
                <p>Control how we keep you updated</p>
            </div>
        </div>
        <form onsubmit="return false">
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="c1" checked>
                <label class="form-check-label" for="c1">Project updates</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="c2" checked>
                <label class="form-check-label" for="c2">Invoice and payment reminders</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="c3">
                <label class="form-check-label" for="c3">Monthly newsletter</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="c4" checked>
                <label class="form-check-label" for="c4">Meeting reminders</label>
            </div>
            <hr style="border-color:var(--border-glass)">
            <h3 class="value-title" style="font-size:1rem">Team Access</h3>
            <p class="value-desc mb-3">Invite colleagues to view your projects and documents.</p>
            <button class="dash-btn" type="button"><i class="bi bi-person-plus"></i> Invite Teammate</button>
        </form>
    </div>
</div>
            </main>
        </div>
    </div>
    <div class="dash-overlay" id="dashOverlay"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/dashboard-layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
