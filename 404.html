<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060313">
    <meta name="description" content="The page you are looking for could not be found. Explore Stackly's services, case studies and insights instead.">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Stackly</title>
    <link rel="icon" type="image/webp" href="images/logo-brand.webp">
    <link rel="apple-touch-icon" href="images/logo-brand.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <main class="error-page">
        <a href="index.html" class="error-logo" aria-label="Stackly home">
            <img src="images/logo-brand.webp" alt="Stackly logo" class="brand-logo">
        </a>
        <div class="container">
            <div class="error-content text-center mx-auto">
                <span class="hero-badge">ERROR 404</span>
                <div class="error-code">404</div>
                <h1 class="page-hero-title">This Page Took a <span class="text-accent">Detour</span></h1>
                <p class="page-hero-subtitle mx-auto">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
                <div class="error-actions">
                    <a href="index.html" class="btn btn-primary-hero"><i class="bi bi-arrow-left"></i> Back to Home</a>
                    <button type="button" class="btn btn-ghost" onclick="history.back()"><i class="bi bi-arrow-counterclockwise"></i> Go Back</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
